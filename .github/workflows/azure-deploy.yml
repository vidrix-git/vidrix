name: Build and Deploy Vidrix ERP to Azure
on:
  push:
    branches:
      - main
      - release/azure-auth-fix
env:
  AZURE_WEBAPP_NAME: vidrix-erp-final
  AZURE_RESOURCE_GROUP: vidrix-prod-rg
permissions:
  contents: read
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Package Azure runtime
        run: |
          rm -rf azure-package
          mkdir -p azure-package/public
          pnpm exec esbuild server/azure-startup.ts --platform=node --bundle --format=cjs --outfile=azure-package/azure-startup.js
          cp -R dist/public/. azure-package/public/
          cp package.json azure-package/package.json
          sed -i 's/"type": "module"/"type": "commonjs"/' azure-package/package.json
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BD1C0C26B3C74C89BB4EFD9AE73133EC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9C28320A2B844FB5BED19BFAE94B5194 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C58C1234D1CC48A28CD8C2B105445B90 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: ./azure-package
          startup-command: "node azure-startup.js"
