name: Deploy Vidrix ERP to Azure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: 'vidrix-erp'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/vidrix-erp:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/vidrix-erp:latest \
            .

          docker push ${{ secrets.ACR_LOGIN_SERVER }}/vidrix-erp:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/vidrix-erp:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/vidrix-erp:${{ github.sha }}'
